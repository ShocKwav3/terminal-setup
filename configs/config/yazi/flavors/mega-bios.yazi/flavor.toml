#:schema https://yazi-rs.github.io/schemas/theme.json

# MEGA BIOS flavour for Yazi (unaffiliated retro-firmware homage)
# Pentium-era windowed-BIOS setup look: deep blue desktop, silver/grey panels,
# DOS 16-colour CGA accents (cyan / yellow / red / green / magenta).
# COLOURS ONLY — every structural glyph (borders, separators, padding) is
# kept identical to the previous flavour so layout/behaviour is unchanged.

[app]
overall = { bg = "#0000A8" }

[mgr]

# Current working directory (title path) — BIOS yellow
cwd = { fg = "#FEFE54" }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied = { fg = "#FEFE54", bg = "#FEFE54" }
marker_cut = { fg = "#FE5454", bg = "#FE5454" }
marker_marked = { fg = "#FE54FE", bg = "#FE54FE" }
marker_selected = { fg = "#54FEFE", bg = "#54FEFE" }

# Count
count_copied = { fg = "#0000A8", bg = "#FEFE54" }
count_cut = { fg = "#0000A8", bg = "#FE5454" }
count_selected = { fg = "#0000A8", bg = "#54FEFE" }

# Border — silver AMI window frame
border_symbol = "│"
border_style = { fg = "#C6C6C6" }

# Find
[mgr.find_keyword]
fg = "#0000A8"
bg = "#FEFE54"
bold = true
italic = true
underline = true

[mgr.find_position]
fg = "#FFFFFF"
bg = "reset"
bold = true
italic = true


# Indicator
[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

# Tabs — active tab as a raised silver panel
[tabs]
active = { fg = "#0000A8", bg = "#C6C6C6" }
inactive = { fg = "#C6C6C6", bg = "#000078" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }


# Modes (status-bar end sections). Classic AMI: grey bar for normal,
# yellow for select, red for unset — all on the deep-blue desktop.
[mode]

# Normal mode
normal_main = { fg = "#0000A8", bg = "#C6C6C6" }
normal_alt = { fg = "#FFFFFF", bg = "#000078" }

# Select mode
select_main = { fg = "#0000A8", bg = "#FEFE54" }
select_alt = { fg = "#FEFE54", bg = "#000078" }

# Unset mode
unset_main = { fg = "#FFFFFF", bg = "#A80000" }
unset_alt = { fg = "#FE5454", bg = "#000078" }


[status]
overall = { fg = "#C6C6C6", bg = "#000078" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions — DOS attribute colours
perm_sep = { fg = "#7C7CBE" }
perm_type = { fg = "#54FEFE" }
perm_read = { fg = "#FEFE54" }
perm_write = { fg = "#FE5454" }
perm_exec = { fg = "#54FE54" }

# Progress
progress_label = { fg = "#FFFFFF", bold = true }
progress_normal = { fg = "#54FEFE", bg = "#000078" }
progress_error = { fg = "#FE5454", bg = "#000078" }


[which]
cols = 3
mask = { bg = "#000078" }
cand = { fg = "#FEFE54" }
desc = { fg = "#54FEFE" }
separator = " ➜ "
separator_style = { fg = "#C6C6C6" }


[confirm]
border = { fg = "#C6C6C6" }
title = { fg = "#FEFE54" }
body = {}
list = {}
btn_yes = { fg = "#54FE54" }
btn_no = { fg = "#FE5454" }
btn_labels = ["Yes", "No"]


[spot]
border = { fg = "#C6C6C6" }
title = { fg = "#FEFE54" }

# Value of the items in the table
tbl_col = { fg = "#54FEFE" }

# Hovered item in the spotter — highlight bar
tbl_cell = { bg = "#0000D4" }


[notify]
title_info = { fg = "#54FEFE" }
title_warn = { fg = "#FEFE54" }
title_error = { fg = "#FE5454" }

# Icons
icon_info = ""
icon_warn = ""
icon_error = ""


[pick]
border = { fg = "#C6C6C6" }
active = { fg = "#FEFE54", bold = true }
inactive = {}


[input]
border = { fg = "#C6C6C6" }
title = { fg = "#FEFE54" }
value = {}
selected = { reversed = true }


[cmp]
border = { fg = "#C6C6C6" }
active = { bg = "#0000D4" }
inactive = {}

# Icons
icon_file = ""
icon_folder = ""
icon_command = ""


[tasks]
border = { fg = "#C6C6C6" }
title = { fg = "#FEFE54" }
hovered = { bg = "#0000D4", bold = true }


[help]
on = { fg = "#FEFE54" }
run = { fg = "#54FEFE" }
desc = { fg = "#FFFFFF" }
footer = { bg = "#000078", fg = "#C6C6C6" }


[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#FE54FE" },

	# Videos
	{ mime = "video/*", fg = "#5454FE" },

	# Audio
	{ mime = "audio/*", fg = "#54FEFE" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#FE5454" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#54FE54" },

	# Special files
	{ url = "*", is = "orphan", fg = "#FFFFFF", bg = "#A80000" },
	{ url = "*", is = "exec", fg = "#54FE54" },

	# Dummy files
	{ url = "*", is = "dummy", fg = "#FFFFFF", bg = "#A80000" },
	{ url = "*/", is = "dummy", fg = "#FFFFFF", bg = "#A80000" },

	# Fallback — files light silver, directories bright cyan (DOS listing)
	{ url = "*", fg = "#C6C6C6" },
	{ url = "*/", fg = "#54FEFE" },
]
